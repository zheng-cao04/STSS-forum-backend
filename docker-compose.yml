services:
  forum-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stss_forum_api
    ports:
      - "5000:5000"
    environment:
      APP_NAME: ${APP_NAME:-STSS Forum Backend}
      ENV: ${ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/forum.db}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      PUBLIC_UPLOAD_PREFIX: ${PUBLIC_UPLOAD_PREFIX:-/uploads}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      SKIP_EXTERNAL_CHECKS: ${SKIP_EXTERNAL_CHECKS:-true}
      INFO_SERVICE_URL: ${INFO_SERVICE_URL:-http://host.docker.internal:8002}
      COURSE_SELECTION_SERVICE_URL: ${COURSE_SELECTION_SERVICE_URL:-http://host.docker.internal:8003}
      SCORE_SERVICE_URL: ${SCORE_SERVICE_URL:-http://host.docker.internal:8004}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
    volumes:
      - forum_data:/app/data
      - forum_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/forum/healthz')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - stss-network

volumes:
  forum_data:
  forum_uploads:

networks:
  stss-network:
    driver: bridge
